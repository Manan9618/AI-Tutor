# app/database/migrations/alembic.ini

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
version_path_separator = os

# Database URL (overridden by env var if present)
sqlalchemy.url = sqlite+aiosqlite:///./data/ai_tutor.db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
